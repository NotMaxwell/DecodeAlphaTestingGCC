name: Bug Report
description: Report a bug or unexpected robot behavior
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong? Describe the bug clearly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Enable the robot in teleop
        2. Press button X
        3. Observe behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem Affected
      options:
        - Drivebase
        - Autonomous
        - Intake
        - Shooter
        - Vision
        - Constants
        - Other
    validations:
      required: true
